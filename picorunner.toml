schema = 1
name = "Squish"

[runtime]
kind = "node"
version = "24"
package_manager = "npm"

[[setup.steps]]
kind = "dependencies"
locked = true

[[setup.steps]]
run = ["npm", "run", "build"]

[launch]
command = ["npm", "run", "preview", "--", "--host", "{host}", "--port", "{port}", "--strictPort"]
host = "127.0.0.1"
port = 4173

[health]
type = "http"
path = "/"
timeout_seconds = 90

[persistence]
# Browser-managed state and user downloads are outside the repository.
paths = []
